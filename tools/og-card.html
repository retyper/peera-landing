<!doctype html>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden;
         font-family:"Jua","Malgun Gothic",sans-serif;
         background:
           radial-gradient(900px 420px at 88% 42%, #FFF3E2 0%, rgba(255,243,226,0) 62%),
           #FFFDF8;
         display:flex; align-items:center; }

  .left { width:706px; padding:0 0 0 64px; }

  .brand { display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .brand img { width:56px; height:56px; border-radius:50%; }
  .brand b { font-size:36px; color:#3D2B1F; font-weight:400; }
  .brand span { font-size:22px; color:#8B7355; }

  h1 { font-size:52px; line-height:1.3; word-break:keep-all; white-space:nowrap; color:#3D2B1F; font-weight:400; letter-spacing:-.01em; }
  h1 .o { color:#E1751F; }

  .sub { margin-top:24px; font-size:24px; line-height:1.6; color:#6B5544; }
  .sub b { color:#3D2B1F; font-weight:400; }

  /* 사이트 CTA와 동일: 금색(#EFA00B) 배경 + 진한 잉크색 글씨 + 금색-다크 그림자 */
  .cta { display:inline-block; margin-top:34px; background:#EFA00B; color:#3D2B1F;
         font-size:25px; padding:16px 34px 19px; border-radius:999px;
         box-shadow:0 5px 0 #B8760A; }

  /* 폰 목업 — 본품 아트(writy-still.png)를 그대로 넣는다 */
  .right { flex:1; display:flex; justify-content:center; align-items:center; position:relative; }
  .phone { width:286px; height:572px; border-radius:46px; background:#1C1C1E;
           padding:11px; box-shadow:0 22px 50px rgba(61,43,31,.22); position:relative; }
  .screen { width:100%; height:100%; border-radius:36px; overflow:hidden; position:relative; background:#BFE7E4; }
  .screen img { width:100%; height:100%; object-fit:cover; object-position:center 42%; }
  .notch { position:absolute; top:11px; left:50%; transform:translateX(-50%);
           width:104px; height:26px; background:#1C1C1E; border-radius:999px; z-index:3; }

  /* 라이티가 보낸 문자 알림 */
  .notif { position:absolute; top:40px; left:16px; right:16px; z-index:4;
           background:rgba(255,253,248,.97); border-radius:19px; padding:11px 14px 13px;
           box-shadow:0 5px 16px rgba(61,43,31,.18); }
  .n-head { display:flex; align-items:center; gap:7px; }
  .n-head img { width:22px; height:22px; border-radius:50%; }
  .n-head b { font-size:15px; color:#3D2B1F; font-weight:400; }
  .n-head span { font-size:12px; color:#A08D74; margin-left:auto; }
  .n-text { font-size:14.5px; line-height:1.45; color:#4A3423; margin-top:4px; }
</style>

<div class="left">
  <div class="brand">
    <img src="../writy-avatar.png" alt="">
    <b>피어라</b><span>Peera</span>
  </div>

  <h1>화난 게 아니라<br><span class="o">아쉬웠던 거야</span></h1>

  <p class="sub">
    오늘 들려준 이야기가<br>
    <b>손글씨 일기가 됩니다</b>
  </p>

  <span class="cta">먼저 알림받기</span>
</div>

<div class="right">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <img src="../writy-still.png" alt="">
      <div class="notif">
        <div class="n-head"><img src="../writy-avatar.png" alt=""><b>라이티</b><span>지금</span></div>
        <div class="n-text">나 오늘 진짜 커다란 도토리를 주웠어!</div>
      </div>
    </div>
  </div>
</div>
